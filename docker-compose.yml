# Local Postgres for development and tests (alternative to Neon).
# Start with: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openbell
      POSTGRES_PASSWORD: openbell
      POSTGRES_DB: openbell
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
